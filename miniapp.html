<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Alpha Odds Admin</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10120f;color:#f3f3ed}*{box-sizing:border-box}body{margin:0;padding:calc(24px + env(safe-area-inset-top)) 20px calc(110px + env(safe-area-inset-bottom));max-width:720px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}small{color:#a4ab9c;font-size:12px;letter-spacing:2px}h1{font-size:28px;margin:9px 0 25px}.badge{background:#252b1d;color:#d5e9ac;padding:10px;border-radius:50%}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#1b1f17;border:1px solid #303728;padding:20px;border-radius:20px}.stat strong{display:block;font-size:34px;color:#d9eb99}.stat span{color:#b1b8a7;font-size:13px}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:14px 18px;background:#d9eb99;color:#17200c;font-weight:650}button:disabled{opacity:.5;cursor:wait}.heading{display:flex;justify-content:space-between;align-items:center;margin-top:26px}.heading h2{font-size:18px}.secondary{background:#252b20;color:#e0e6d8}input{width:100%;padding:14px;background:#1b1f17;border:1px solid #303728;border-radius:13px;color:#fff;margin:12px 0}.row{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid #2b3025}.avatar{width:42px;height:42px;border-radius:14px;background:#2d3523;color:#d9eb99;display:grid;place-items:center;flex-shrink:0}.name{flex:1;min-width:0;overflow-wrap:anywhere}.name p{margin:4px 0;color:#a4ab9c;font-size:12px}.tag{color:#d9eb99;font-size:11px}.waiting{color:#b6bba9}.empty{text-align:center;color:#a4ab9c;padding:34px 5px}#notice{white-space:pre-wrap;padding:16px;background:#252b20;border-radius:14px;margin-top:18px;line-height:1.6;display:none}#floating{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));right:24px;border-radius:50%;width:64px;height:64px;font-size:27px;box-shadow:0 8px 35px #0008;z-index:3}dialog{border:1px solid #3b452f;border-radius:24px;background:#1b1f17;color:#f3f3ed;width:calc(100% - 32px);max-width:430px;padding:24px}dialog::backdrop{background:#0009}dialog button{width:100%;margin-top:12px}dialog p{color:#adb6a0;line-height:1.5}#error{color:#efbaac}
</style></head><body><header><small>ALPHA ODDS</small><span class="badge">🏆</span></header><h1>Request manager</h1><div class="stats"><div class="stat"><strong id="total">—</strong><span>Saved pending</span></div><div class="stat"><strong id="started">—</strong><span>Started the bot</span></div></div><div id="notice" role="status"></div><p id="error" role="alert"></p><div class="heading"><h2>Pending requests</h2><button class="secondary" id="refresh">↻ Refresh</button></div><input id="search" type="search" placeholder="Find a name or Telegram ID" aria-label="Search pending requests"><div id="list"><p class="empty">Loading requests…</p></div><button id="floating" aria-label="Open actions">☰</button><dialog id="menu"><small>QUICK ACTIONS</small><h2>Manage requests</h2><p>Approve saved requests using the same controls as your bot.</p><button id="accept-started" disabled>Accept Started</button><button id="accept-all" disabled>Accept All</button><button class="secondary" id="myid">My ID</button><button class="secondary" id="close">Close</button></dialog><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const $=id=>document.getElementById(id);let state=null,poll=null,busy=false;
function render(){if(!state)return;$('total').textContent=state.total;$('started').textContent=state.started;const query=$('search').value.toLowerCase();const rows=state.requests.filter(r=>(r.name+' '+(r.username||'')+' '+r.id).toLowerCase().includes(query));$('list').replaceChildren();if(!rows.length){const p=document.createElement('p');p.className='empty';p.textContent=state.total?'No matching requests.':'All clear. No saved pending requests.';$('list').append(p)}for(const r of rows){const row=document.createElement('div');row.className='row';const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=r.name.slice(0,1).toUpperCase();const name=document.createElement('div');name.className='name';const title=document.createElement('strong');title.textContent=r.name;const detail=document.createElement('p');detail.textContent=r.username?'@'+r.username:String(r.id);name.append(title,detail);const tag=document.createElement('span');tag.className='tag'+(r.started?'':' waiting');tag.textContent=r.started?'Started':'Not started';row.append(avatar,name,tag);$('list').append(row)}const running=state.job.running;$('accept-all').disabled=running||!state.total||busy;$('accept-started').disabled=running||!state.started||busy;$('notice').style.display=running||state.job.result?'block':'none';$('notice').textContent=running?'Approving requests… You can keep this window open to see the result.':state.job.result;if(running&&!poll)poll=setTimeout(()=>{poll=null;load()},1500)}
async function load(action='state'){if(busy)return;if(!tg?.initData){$('error').textContent='Open this page using the Admin button inside Telegram.';$('list').replaceChildren();return}busy=true;$('refresh').disabled=true;render();try{const response=await fetch('/api/admin/'+action,{method:'POST',headers:{'X-Telegram-Init-Data':tg.initData}});if(!response.ok)throw Error(response.status===403?'Your session expired. Close and reopen the Admin button.':'Unable to connect. Tap Refresh to retry.');state=await response.json();$('error').textContent=''}catch(e){$('error').textContent=e.message;if(state?.job.running&&!poll)poll=setTimeout(()=>{poll=null;load()},3000)}finally{busy=false;$('refresh').disabled=false;render()}}
$('myid').onclick=()=>{if(state)alert('Your Telegram ID: '+state.adminId)};$('search').oninput=render;$('refresh').onclick=()=>load();$('floating').onclick=()=>$('menu').showModal();$('close').onclick=()=>$('menu').close();$('accept-started').onclick=()=>{$('menu').close();load('started')};$('accept-all').onclick=()=>{if(confirm('Approve all '+state.total+' saved requests?')){$('menu').close();load('all')}};load();
</script></body></html>
